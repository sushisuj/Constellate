# ReadTheDocs build config (v2 schema). Connect this repo at
# readthedocs.org and it picks this up automatically -- nothing else to
# configure there beyond linking the GitHub repo.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
